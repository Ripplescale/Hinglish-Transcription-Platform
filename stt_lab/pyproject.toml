[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sttbench"
version = "0.1.0"
description = "Local Hinglish transcription benchmarks and evidence-based qualification"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
sttbench = "sttbench.cli:main"

[tool.setuptools.packages.find]
include = ["sttbench*"]
