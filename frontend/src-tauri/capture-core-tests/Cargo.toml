[package]
name = "stt-capture-core-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
dirs = "5"

[dev-dependencies]
syn = { version = "3", features = ["full"] }

[build-dependencies]
syn = { version = "3", features = ["full"] }
quote = "1"
